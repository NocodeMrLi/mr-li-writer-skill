interface:
  display_name: "Mr.Li Writer"
  short_description: "中文内容写作：编辑判断、平台原生写作、公众号排版、去 AI 味"
  default_prompt: >-
    Use $mr-li-writer to identify the reader job, material basis, and minimum necessary innovation
    before drafting. Do not force angle upgrades, theme
    elevation, or novel concepts when a direct and useful direction already
    works. Establish the speaking position and reality-or-fiction boundary;
    make each paragraph add material, action, distinction, reasoning, or
    consequence. Draft positively first, then run action-level humanization
    review. Separate publishing platform from content goal, then research,
    plan, write in platform-native form, title, and deliver with the
    platform-specific style. Publishing platform is a required delivery-shape
    field: if the user does not specify it, ask them to choose or require clear
    authorization before auto-selecting. Do not force WeChat's four artifacts
    on every platform. File delivery starts with title strategy and the
    platform-native source. Add clean layout HTML and copy-preview HTML only
    when the platform or user requires layout; websites require HTML by
    default. After Zhihu or Xiaohongshu is selected, ask whether HTML layout preview is needed
    before drafting unless the user already chose or explicitly said not to
    ask and to auto-match. Explain that no layout means title strategy plus
    native source, while layout adds clean HTML and copy-preview HTML. Apply
    three-layer confirmation: always confirm publishing platform, content goal,
    writing direction, and platform delivery style; conditionally confirm
    reader scene, stance boundary, time-sensitive cutoff, source boundary,
    delivery format, and depth only when they change the result; do not ask by
    default about tone, opening type, title count, aphorisms, or examples.
    At the start of every new task, before fetching source links, searching the web,
    reading external articles, creating a task list, drafting, generating files,
    layout, or delivery, run scripts/validate_task_intake.py --from-prompt with
    the user's original request, --phase task-list, and --emit-question-card. If
    it blocks, stop and present the generated question card as the user
    confirmation message. Do not invent a shorter selector, merge a WeChat
    layout theme into the publishing-platform option, hide options, or continue
    to task creation/search/drafting. The question card must include publishing
    platform, content goal, 3-5 writing-direction options with [most
    recommended] and [second recommended], platform delivery style, and a
    free-form/self-input field for reader scene, stance boundary, time cutoff,
    source boundary, depth, or custom preferences. After the user answers, create a task-state
    JSON that records only real user confirmations or explicit auto-match
    authorization, then pass --task-state to formal generation and delivery
    scripts. Never mark model inference, memory, recommended options, platform
    defaults, or historical defaults as confirmed. Local authorization such as
    "auto-match the title" or "you decide the tags" applies only to that field;
    never expand it into confirmed platform, content goal, writing direction,
    or platform delivery style.
    Memory firewall: long-term preferences, standing instructions, historical
    defaults, previous tasks, and habits from another skill cannot override this
    skill's required questions. Only explicit authorization in the current user
    task counts as auto-match/no-ask/direct-processing permission. Do not
    convert "I usually prefer direct execution" or another layout skill's habit
    into confirmed platform, content goal, writing direction, or delivery style
    for mr-li-writer.
    Required fields and triggered conditional fields are hard gates. Do not
    draft, create tasks, create files, layout, or deliver while a required
    field is missing. Triggered conditional fields become required for that task. Do not replace user confirmation with model inference, historical
    defaults, platform defaults, or recommended options. A confirmation for one
    field must never be stretched into confirmation for another field.
    Do not draft, create tasks, create files, layout, or deliver before the
    hard gates are satisfied.
    Apply minimum necessary questions to every platform: ask for a WeChat
    theme, Zhihu answer-versus-column and HTML preview when unclear,
    Xiaohongshu plain-note versus phone-card preview, website page style and
    publishing environment, and blog format (Markdown, CMS rich text, or static
    HTML).
    Hard rule: after the publishing platform is known, confirm the platform delivery style before drafting, creating a task list, creating source files,
    generating HTML, or delivering files. This applies to every platform, not
    only WeChat. Show the complete option set for the selected platform, not
    only recommended options. If the host picker cannot display all options,
    write the full list in the message and ask the user to reply with a number,
    name, or auto-match. Always confirm the platform delivery style before drafting. Always show the complete option set, not only recommended options.
    For WeChat, always call it "WeChat layout theme" and
    show all six WeChat layout themes plus auto-match: moyu-green, red-white,
    graphite-minimal, zen-whitespace, moyu-ticket, olive-journal, auto-match.
    A recommended style, confirmed article topic, confirmed writing direction,
    approved draft, or previous default is not user confirmation.
    When the user says "continue", "resume", "continue the unfinished task", or
    similar after a token limit, model switch, context compaction, or long task
    interruption, first re-check the task state. Never treat "continue" as
    confirmation that missing required fields are already answered. If
    publishing platform, content goal, writing direction, platform delivery
    style, required WeChat theme, platform preview choice, time cutoff, or
    source boundary is missing, stop and ask a short recovery confirmation
    before drafting, layout generation, or file delivery.
    If the publishing platform is missing, stop and ask before drafting or
    calling layout scripts, unless the user explicitly authorized auto-match.
    When asking for the writing direction, give 3-5 concrete options and mark
    the best one as [most recommended] and the second best as [second
    recommended]. For WeChat final layout, never silently choose any theme:
    pass a concrete -t theme with --theme-confirmed only after the user chose
    it, or pass --auto-theme-ok only after the user clearly said to
    auto-match/directly layout/no need to ask. If the user confirmed a platform
    and the writing direction but did not confirm the platform delivery style,
    stop and ask for the style before adding a themed/card/structured HTML
    task. Merge
    missing decisions into one short confirmation and never repeat facts
    the user already supplied. For WeChat
    Official Account, do not use a generic
    Markdown-to-HTML long-article template. Read
    assets/gzh-design/references/theme-index.md, then read the selected
    theme-*.md and common-components.md. Assemble the final WeChat HTML from
    the real gzh-design component library, following that theme's full article
    skeleton, article-type component recipe, and Markdown-to-component mapping.
    scripts/build_gzh_html.py should run in component-library mode; fallback mode
    is only for emergency preview and should not be treated as final layout.
    WeChat TOC cards must stay within the article width without horizontal
    scrolling or viewport-width CSS. Markdown tables must become semantic,
    fixed-layout HTML tables with wrapping cells; never leave pipe syntax in
    reader-facing output. A completed WeChat delivery always contains four real
    artifacts: title-strategy Markdown, article-source Markdown, clean WeChat
    HTML, and copy-preview HTML. Run validate_gzh_html.py and
    validate_delivery_bundle.py before attaching the files.

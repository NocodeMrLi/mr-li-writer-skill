interface:
  display_name: "Mr.Li Writer"
  short_description: "中文内容写作：选题诊断、平台原生写作、公众号排版、去 AI 味"
  default_prompt: >-
    Use $mr-li-writer to evaluate and upgrade a Chinese content idea through web
    research, separate publishing platform from content goal, then research,
    plan, write in platform-native form, humanize, title, and deliver with the
    platform-specific style. For WeChat Official Account, do not use a generic
    Markdown-to-HTML long-article template. Read
    assets/gzh-design/references/theme-index.md, then read the selected
    theme-*.md and common-components.md. Assemble the final WeChat HTML from
    the real gzh-design component library, following that theme's full article
    skeleton, article-type component recipe, and Markdown-to-component mapping.
    scripts/build_gzh_html.py should run in component-library mode; fallback mode
    is only for emergency preview and should not be treated as final layout.
